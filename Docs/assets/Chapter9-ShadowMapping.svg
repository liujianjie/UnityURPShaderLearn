<svg xmlns="http://www.w3.org/2000/svg" width="900" height="458" viewBox="0 0 900 458" role="img" aria-labelledby="title description">
  <title id="title">方向光的阴影映射：从三维场景写深度，再用地板坐标比较</title>
  <desc id="description">方向光向下照射。方块顶面 A 和正下方的地板 P 投影到同一格，A 的 0.30 更近而被写入。旁边地板 Q 投影到另一格，查到地板深度 0.80。P 被遮挡，Q 受光。</desc>
  <defs>
    <marker id="light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9b551a"/>
    </marker>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#53647a"/>
    </marker>
    <style>
      text { font-family: 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #1b2c40; }
      .label { font-size: 16px; }
      .sub { fill: #506179; font-size: 15px; }
      .head { font-size: 22px; font-weight: 700; }
      .value { font-family: Consolas, monospace; font-size: 20px; }
      .blocked { fill: #973e25; }
      .lit { fill: #136858; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="456" rx="16" fill="#fff" stroke="#cbd5df"/>
  <line x1="447" y1="28" x2="447" y2="351" stroke="#dbe2ea"/>
  <text x="30" y="41" class="head">① 场景侧视：同一束光先碰到谁？</text>
  <text x="30" y="66" class="sub">世界 X–Y 剖面，固定 Z = 2.5</text>
  <text x="74" y="101" class="label">方向光 ↓</text>
  <text x="472" y="41" class="head">② 灯光俯视：只保存最近深度</text>
  <text x="472" y="66" class="sub">4 × 4 深度纹理，每格一个数（普通 Z）</text>

  <path d="M74 116H378M74 336H378" fill="none" stroke="#c3ceda" stroke-dasharray="4 5"/>
  <text x="372" y="111" class="sub" text-anchor="end">近面 Y=10</text>
  <text x="372" y="356" class="sub" text-anchor="end">远面 Y=0</text>
  <path d="M74 336V116M74 336H386" fill="none" stroke="#53647a" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <text x="62" y="130" class="sub" text-anchor="end">Y</text>
  <text x="396" y="341" class="sub">X</text>
  <path d="M74 292H378" stroke="#556b83" stroke-width="3"/>
  <path d="M151 292H225" stroke="#c66842" stroke-width="8"/>
  <rect x="150" y="182" width="76" height="44" rx="2" fill="#cfdcee" stroke="#617993" stroke-width="1.5"/>
  <text x="188" y="210" class="label" text-anchor="middle">方块</text>
  <path d="M188 104V173" stroke="#9b551a" stroke-width="2.4" marker-end="url(#light-arrow)"/>
  <path d="M264 104V280" stroke="#9b551a" stroke-width="2.4" marker-end="url(#light-arrow)"/>
  <path d="M188 227V283" stroke="#973e25" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="188" cy="182" r="5" fill="#974629"/>
  <circle cx="188" cy="292" r="5.5" fill="#974629"/>
  <circle cx="264" cy="292" r="5.5" fill="#136858"/>
  <text x="174" y="171" class="label blocked" text-anchor="end">A · 0.30</text>
  <text x="188" y="318" class="label blocked" text-anchor="middle">P · 0.80</text>
  <text x="264" y="318" class="label lit" text-anchor="middle">Q · 0.80</text>
  <text x="368" y="282" class="label" text-anchor="end">地板</text>

  <rect x="548" y="104" width="256" height="216" fill="#f2f6fa"/>
  <rect x="612" y="158" width="64" height="54" fill="#fce1d4"/>
  <rect x="676" y="158" width="64" height="54" fill="#d8f2eb"/>
  <path d="M548 104H804V320H548ZM612 104V320M676 104V320M740 104V320M548 158H804M548 212H804M548 266H804" fill="none" stroke="#a9b9cb"/>
  <path d="M530 320V104" stroke="#53647a" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <path d="M548 349H804" stroke="#53647a" stroke-width="1.3" marker-end="url(#axis-arrow)"/>
  <text x="527" y="94" class="label">v</text>
  <text x="816" y="354" class="label">u</text>
  <g class="sub" text-anchor="middle">
    <text x="517" y="136">3</text><text x="517" y="190">2</text><text x="517" y="244">1</text><text x="517" y="298">0</text>
    <text x="580" y="341">0</text><text x="644" y="341">1</text><text x="708" y="341">2</text><text x="772" y="341">3</text>
  </g>
  <g class="value" text-anchor="middle">
    <text x="580" y="138">0.80</text><text x="644" y="138">0.80</text><text x="708" y="138">0.80</text><text x="772" y="138">0.80</text>
    <text x="580" y="192">0.80</text><text x="644" y="192" class="blocked">0.30</text><text x="708" y="192" class="lit">0.80</text><text x="772" y="192">0.80</text>
    <text x="580" y="246">0.80</text><text x="644" y="246">0.80</text><text x="708" y="246">0.80</text><text x="772" y="246">0.80</text>
    <text x="580" y="300">0.80</text><text x="644" y="300">0.80</text><text x="708" y="300">0.80</text><text x="772" y="300">0.80</text>
  </g>

  <rect x="24" y="373" width="852" height="64" rx="10" fill="#edf2f8"/>
  <text x="43" y="398" class="label" font-weight="bold">③ 用 u、v 找格；用地板点自己的深度和格内深度比较</text>
  <text x="43" y="423" class="label blocked">P → [1, 2]：0.80 &gt; 0.30 → 遮挡</text>
  <text x="475" y="423" class="label lit">Q → [2, 2]：0.80 = 0.80 → 受光</text>
</svg>
