<body>
<main class="page">
  <header class="masthead">
    <div>
      <div class="chapter">CHAPTER 10 / 玻璃取色实验</div>
      <h1>透过花纹玻璃，这一小点会是什么颜色？</h1>
      <p class="intro">一块玻璃挡在砖红墙和蓝墙交界处。盯住玻璃上的一个像素 <b>P</b>，看看墙的颜色和窗的倒影怎样一起画到这里。</p>
    </div>
    <a class="note-link" href="Chapter10-Reflection-Refraction.md#glass-refraction">第 10 章笔记 ↗</a>
  </header>

  <nav class="flow" aria-label="玻璃 Shader 的四步流程">
    <button type="button" data-step="basis" aria-pressed="true"><span class="index">01</span><span><b>法线换轴</b><small>从贴图读数到世界方向</small></span></button>
    <button type="button" data-step="refraction" aria-pressed="false"><span class="index">02</span><span><b>折射取色</b><small>去墙上的哪里借色？</small></span></button>
    <button type="button" data-step="reflection" aria-pressed="false"><span class="index">03</span><span><b>位置与视线</b><small>worldPos → worldViewDir → 倒影</small></span></button>
    <button type="button" data-step="mix" aria-pressed="false"><span class="index">04</span><span><b>混合颜色</b><small>把两份颜色画回 P</small></span></button>
  </nav>
  <nav class="subflow" id="subflow" aria-label="当前章节的代码步骤" hidden></nav>

  <header class="lesson-head">
    <h2 id="lesson-title" tabindex="-1">bump 是图里的哪根箭头？</h2>
    <p id="purpose"></p>
  </header>
  <div class="lab">
    <figure class="figure">
      <div class="figure-top">
        <figcaption id="caption" class="caption"></figcaption>
        <div class="view-tools" id="view-tools" role="group" aria-label="观察方式">
          <button class="soft-button" id="flat-view" type="button" aria-pressed="true">图解</button>
          <button class="soft-button" id="space-view" type="button" aria-pressed="false">三维图</button>
          <button class="soft-button" id="reset-view" type="button" hidden>复位视角</button>
        </div>
      </div>
      <div class="presets" id="presets" role="group" aria-label="只改变贴图法线倾角">
        <span>对照倾角</span>
        <button type="button" class="soft-button" data-tilt="0">平整 0°</button>
        <button type="button" class="soft-button" data-tilt="30">正倾 +30°</button>
        <button type="button" class="soft-button" data-tilt="-30">反倾 −30°</button>
      </div>
      <div class="presets" id="focus-tools" role="group" hidden></div>
      <canvas id="diagram" class="diagram" role="img"></canvas>
      <div id="stage" class="stage" hidden>
        <div id="labels" class="overlay" aria-hidden="true"></div>
      </div>
      <dl class="picture-values" id="picture-values" aria-label="图中标注的当前数值" hidden></dl>
      <ul id="legend" class="legend" aria-label="三维图例" hidden></ul>
      <p id="view-hint" class="view-hint"></p>
      <p class="try"><b>动手试试　</b><span id="try"></span></p>
      <div class="controls">
        <div class="control" id="tilt-control">
          <label for="tilt">贴图法线倾角 <output id="tilt-value" for="tilt">30°</output></label>
          <input id="tilt" type="range" min="-45" max="45" value="30">
        </div>
        <div class="control" id="turn-control">
          <label for="turn">玻璃绕世界 Y 转动 <output id="turn-value" for="turn">−90°</output></label>
          <input id="turn" type="range" min="-90" max="90" value="-90">
          <div class="mini-actions">
            <button type="button" class="soft-button" data-turn="-90">算例 −90°</button>
            <button type="button" class="soft-button" data-turn="0">对照 0°</button>
          </div>
        </div>
        <div class="control" id="cameraX-control" hidden>
          <label for="cameraX">Shader 相机的世界 X <output id="cameraX-value" for="cameraX">−2</output></label>
          <input id="cameraX" type="range" min="-4" max="0" step=".25" value="-2">
        </div>
        <div class="control" id="distortion-control" hidden>
          <label for="distortion">偏移强度 Distortion <output id="distortion-value" for="distortion">40</output></label>
          <input id="distortion" type="range" min="0" max="100" value="40">
        </div>

        </div>
      </div>
      <div id="branches" class="branches">
        <button type="button" data-go="refraction"><i class="chip" id="wall-chip"></i><span><small>02　透过玻璃</small><strong id="wall-name"></strong></span></button>
        <button type="button" data-go="reflection"><i class="chip" id="window-chip"></i><span><small>03　玻璃倒影</small><strong id="window-name"></strong></span></button>
      </div>
      <div id="readout" class="readout"><span class="chip" id="sample-chip" aria-hidden="true"></span><p id="outcome" role="status"></p></div>
    </figure>

    <section class="lesson" aria-labelledby="lesson-title">
      <div class="code-section line-title"><h3>对照第 10 章 Shader</h3><a id="source-link" href="../Assets/Shaders/Chapter10/Chapter10-GlassRefraction.shader">打开源码 ↗</a></div>
      <div id="matrix" class="matrix" hidden>
        <table>
          <caption id="matrix-caption"></caption>
          <thead><tr><th scope="col">输出轴 / 字段</th><th scope="col">T 列</th><th scope="col">B 列</th><th scope="col">N 列</th><th scope="col" data-position>.w 位置</th><th scope="col" data-result>点积</th></tr></thead>
          <tbody id="matrix-values"></tbody>
        </table>
      </div>
      <ol class="walk" id="walk" aria-label="用当前设置一步步算"></ol>
      <div id="mix-strip" class="mix-strip" hidden>
        <div class="mix-item"><i id="reflect-swatch"></i>倒影 <span id="reflect-weight"></span></div>
        <div class="mix-item"><i id="refract-swatch"></i>背景 <span id="refract-weight"></span></div>
        <div class="mix-item"><i id="final-swatch"></i>写回 P</div>
      </div>
      <details class="details" id="more"><summary id="more-title"></summary><dl id="values" class="value-list"></dl></details>
    </section>
  </div>
  <div class="step-actions">
    <button id="previous" class="soft-button" type="button">← 上一步</button>
    <button id="next" class="soft-button" type="button"></button>
  </div>
  <p class="footnote">同一个玻璃片元 P 贯穿算例。三维图里的 C 对应 Shader 读取的相机位置。拖动三维图只换观察角度，使用相机 X 滑块可以改变 C 的位置。</p>

<script type="module">
  const byId = id => document.getElementById(id);
  const shader = '../Assets/Shaders/Chapter10/Chapter10-GlassRefraction.shader';
  const inputs = Object.fromEntries(['tilt','turn','distortion','amount','cameraX'].map(name => [name,byId(name)]));
  const sourceLines = {
    37: 'sampler2D _BumpMap;',
    41: 'float4 vertex : POSITION;',
    42: 'float3 normal : NORMAL;',
    43: 'float4 tangent : TANGENT;',
    50: 'float4 TtoW0 : TEXCOORD1;',
    51: 'float4 TtoW1 : TEXCOORD2;',
    52: 'float4 TtoW2 : TEXCOORD3;',
    58: 'VertexPositionInputs posInputs = GetVertexPositionInputs(v.vertex.xyz);',
    59: 'o.pos = posInputs.positionCS;',
    63: 'o.uv.zw = TRANSFORM_TEX(v.texcoord, _BumpMap);',
    65: 'VertexNormalInputs normalInputs = GetVertexNormalInputs(v.normal, v.tangent);',
    66: 'float3 worldPos =  posInputs.positionWS;',
    67: 'half3 worldNormal = normalInputs.normalWS;',
    68: 'half3 worldTangent = normalInputs.tangentWS;',
    69: 'half3 worldBinormal = normalInputs.bitangentWS;',
    72: 'o.TtoW0 = float4(worldTangent.x, worldBinormal.x, worldNormal.x, worldPos.x);',
    73: 'o.TtoW1 = float4(worldTangent.y, worldBinormal.y, worldNormal.y, worldPos.y);',
    74: 'o.TtoW2 = float4(worldTangent.z, worldBinormal.z, worldNormal.z, worldPos.z);',
    75: 'return o;',
    77: 'half4 frag(v2f i) : SV_TARGET{',
    78: 'float3 worldPos = float3(i.TtoW0.w, i.TtoW1.w, i.TtoW2.w);',
    79: 'half3 worldViewDir = normalize(_WorldSpaceCameraPos.xyz - worldPos);',
    82: 'half3 bump = UnpackNormal(tex2D(_BumpMap, i.uv.zw));',
    85: 'float2 screenUV = GetNormalizedScreenSpaceUV(i.pos);',
    86: 'float2 offsetUV = bump.xy * _Distortion / GetScaledScreenParams().xy;',
    88: 'half3 refrCol = SampleSceneColor(screenUV + offsetUV);',
    92: 'bump = normalize(half3(dot(i.TtoW0.xyz, bump), dot(i.TtoW1.xyz, bump), dot(i.TtoW2.xyz, bump)));',
    93: 'half3 reflDir = reflect(-worldViewDir, bump);',
    94: 'half4 texColor = tex2D(_MainTex, i.uv.xy);',
    97: 'half3 reflCol = texCUBE(_Cubemap, reflDir).rgb * texColor.rgb;',
    100: 'half3 finalColor = reflCol * (1-_RefractAmount) + refrCol * _RefractAmount;',
    102: 'return half4(finalColor, 1.0);'
  };
  const frameLegend = [['t','T · 沿纹理 U'],['b','B · 沿纹理 V'],['n','N · 网格法线']];
  const matrixLegend = [...frameLegend,['mapped','nWS · 换轴后的法线']];
  const viewLegend = [['view','V · P 指向相机'],['ink','−V · 朝玻璃的入射方向']];
  const axisChoices = {key:'axis', label:'看哪根世界轴', options:['世界 X','世界 Y','世界 Z']};
  const positionLegend = [['t','Q0、Q1、Q2 · 网格顶点'],['ink','白点 P · 正在着色的玻璃位置']];
  const steps = {

      if (start < 0) {
        code.textContent = source;
      } else {

        code.append(source.slice(0, start), mark, source.slice(start + emphasis.text.length));

      row.append(gutter,code);
      block.append(row);
    }
    return block;
  }

    const deg=Math.PI/180;
    const photoWidth=4.3, photoHeight=photoWidth*GlassLab.size[1]/GlassLab.size[0], photoZ=-1.63, cubeRadius=2.15;
    const photoPoint=uv=>point.clone().add(vec((uv[0]-originUV[0])*photoWidth,(uv[1]-originUV[1])*photoHeight,photoZ));
    const rgbColor = rgb => new THREE.Color(...rgb);
    const colorStyle=color=>color.getStyle();

    let group=new THREE.Group();
    let tags=[];
    scene.add(group);

    function clear() {
      scene.remove(group);
      group.traverse(item=>{item.geometry?.dispose();item.material?.dispose();});
      group=new THREE.Group();
      scene.add(group);
      tags=[];
      overlay.replaceChildren();
    }
    function mesh(shape,color,position,options={}) {
      const item=new THREE.Mesh(shape,new THREE.MeshBasicMaterial({color,...options}));
      item.position.copy(position);
      group.add(item);
      return item;
    }
    function line(points,color,opacity=.78,dashed=false) {
      const options={color,opacity,transparent:opacity<1};
      const material=dashed ? new THREE.LineDashedMaterial({...options,dashSize:.075,gapSize:.06}) : new THREE.LineBasicMaterial(options);
      const item=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),material);
      if(dashed) item.computeLineDistances();
      group.add(item);
    }
    function arrow(from,to,color,width=.023) {
      const delta=to.clone().sub(from), length=delta.length();
      if(length<.012) return;
      const direction=delta.normalize(), tip=Math.min(width*5.8,length*.32), shaft=length-tip;
      const rotation=new THREE.Quaternion().setFromUnitVectors(up,direction);
      mesh(new THREE.CylinderGeometry(width,width,shaft,8),color,from.clone().addScaledVector(direction,shaft*.5)).quaternion.copy(rotation);
      mesh(new THREE.ConeGeometry(width*2.5,tip,12),color,to.clone().addScaledVector(direction,-tip*.5)).quaternion.copy(rotation);
    }
    function dot(position,color,size=.059) {
      const item=mesh(new THREE.SphereGeometry(size,16,10),color,position,{depthTest:false});
      item.renderOrder=4;
    }
    function label(text,position,color,dx=8,dy=-16,secondary=false) {
      const el=document.createElement('span');
      el.textContent=text;
      el.className='label';
      el.style.setProperty('--label-color',colorStyle(color));
      overlay.append(el);
      tags.push({el,position,dx,dy,secondary});
    }
    function direction(value,length,name,color,dx,dy,width) {
      const end=point.clone().addScaledVector(value,length);
      arrow(point,end,color,width);
      label(name,end,color,dx,dy);
    }
    function glass(data) {
      const tangent=vec(...data.tangent), bitangent=vec(...data.bitangent);
      const onSurface=(u,v)=>point.clone().addScaledVector(tangent,u).addScaledVector(bitangent,v);
      mesh(new THREE.PlaneGeometry(2.72,1.86),palette.t,point,
        {side:THREE.DoubleSide,opacity:.14,transparent:true,depthWrite:false}).rotation.y=data.turn*deg;
      line([[-1.36,-.93],[1.36,-.93],[1.36,.93],[-1.36,.93],[-1.36,-.93]]
        .map(([u,v])=>onSurface(u,v)),palette.t,.87);
      for(const u of [-.91,-.45,0,.45,.91]) line([onSurface(u,-.93),onSurface(u,.93)],palette.t,.30);
      for(const v of [-.62,-.31,0,.31,.62]) line([onSurface(-1.36,v),onSurface(1.36,v)],palette.t,.30);
      label('玻璃面',onSurface(-1.36,.93),palette.t,-7,-19,true);
    }
    function normalFacet(data) {
      const facet = mesh(new THREE.PlaneGeometry(.73,.58),palette.mapped,point,
        {side:THREE.DoubleSide,opacity:.28,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-1});
      facet.quaternion.setFromUnitVectors(vec(0,0,1),vec(...data.ws));
      const corners = [[-.365,-.29],[.365,-.29],[.365,.29],[-.365,.29],[-.365,-.29]]
        .map(([horizontal,vertical])=>vec(horizontal,vertical,0).applyQuaternion(facet.quaternion).add(point));
      line(corners,palette.mapped);
      label('贴图描述的小面',corners[1],palette.mapped,8,10);
    }
    function drawCoordinates(part, data) {
      const {strokes, labels, markers} = GlassLab.coordinateSketch(part, data, focus);
      for (const stroke of strokes) {
        const points = stroke.points.map(value => vec(...value));
        if (stroke.arrow) arrow(points[0], points[1], palette[stroke.color], stroke.width);
        else line(points, palette[stroke.color], stroke.dashed ? .64 : 1, stroke.dashed);
      }
      for (const marker of markers) dot(vec(...marker.at), palette[marker.color], .043);
      for (const tag of labels) label(tag.text, vec(...tag.at), palette[tag.color], tag.dx, tag.dy);
    }
    function background(data) {
      const split = GlassLab.seam / GlassLab.size[0];
      for(const [left,right,wall] of [[0,split,GlassLab.brick],[split,1,GlassLab.blue]]) {
        mesh(new THREE.PlaneGeometry((right-left)*photoWidth,photoHeight),rgbColor(wall.rgb),
          photoPoint([(left+right)/2,.5]),{side:THREE.DoubleSide});
      }
      const corners=[[0,0],[1,0],[1,1],[0,1],[0,0]].map(photoPoint);
      line(corners,palette.sample,.65);
      label('背景快照',corners[3],palette.sample,3,-21,true);
      const from=photoPoint(originUV),to=photoPoint(data.uv);
      from.z+=.035;
      to.z+=.035;
      line([from,point],palette.muted,.9,true);
      if(from.distanceTo(to)<.035) {
        dot(from,palette.sample);
        label(from.distanceTo(to)<.000001?'A = B':'A ≈ B',from,palette.sample,8,-14);
      } else {
        arrow(from,to,palette.sample,.023);
        dot(from,palette.ink,.046);
        dot(to,palette.sample,.056);
        label('A',from,palette.ink,-21,6);
        label('B',to,palette.sample,9,-19);
      }
    }
    function bounce(data,showDetails) {
      const {axis,face,reflected}=data;
      const hit=point.clone().addScaledVector(vec(...reflected),cubeRadius/Math.abs(reflected[axis]));
      const tile=mesh(new THREE.PlaneGeometry(.74,.74),rgbColor(faces[face].rgb),hit,{side:THREE.DoubleSide,opacity:.72,transparent:true,depthWrite:false});
      if(axis===0) tile.rotation.y=Math.PI/2;
      if(axis===1) tile.rotation.x=Math.PI/2;
      if(showDetails) {
        const shell=new THREE.BoxGeometry(cubeRadius*2,cubeRadius*2,cubeRadius*2);
        const edges=new THREE.LineSegments(new THREE.EdgesGeometry(shell),new THREE.LineBasicMaterial({color:palette.muted,transparent:true,opacity:.18}));
        edges.position.copy(point);
        shell.dispose();
        group.add(edges);
        drawCoordinates('bounce', data);
        direction(vec(...data.ws),1,'nWS',palette.mapped,8,-19,.032);
      }
      arrow(point,hit,palette.ray,.030);
      label('R → '+face,hit,palette.ray,8,-20);
    }
    function render() {
      if(viewport.hidden) return;
      renderer.render(scene,viewCamera);
      const width=viewport.clientWidth,height=viewport.clientHeight;
      const occupied=[];
      for(const {el,position,dx,dy,secondary} of tags) {
        const projected=position.clone().project(viewCamera);
        el.hidden=(secondary && width<355) || Math.abs(projected.x)>1.04 || Math.abs(projected.y)>1.04 || Math.abs(projected.z)>1;
        if(el.hidden) continue;
        const px=width*(projected.x*.5+.5),py=height*(.5-projected.y*.5);
        const w=el.offsetWidth,h=el.offsetHeight;
        let box;
        for(const [shiftX,shiftY] of [[dx,dy],[9,11],[-w-9,11],[9,-h-9],[-w-9,-h-9],[-w/2,-h-24],[-w/2,24],[22,0],[-w-22,0]]) {
          const x=THREE.MathUtils.clamp(px+shiftX,2,width-w-2);
          const y=THREE.MathUtils.clamp(py+shiftY,2,height-h-2);
          box={x,y,w,h};
          if(!occupied.some(other=>x<other.x+other.w+3 && x+w>other.x-3 && y<other.y+other.h+3 && y+h>other.y-3)) break;
        }
        occupied.push(box);
        el.style.left=box.x+'px';
        el.style.top=box.y+'px';
      }
    }
    function resize() {
      if(viewport.hidden) return;
      const width=Math.max(1,viewport.clientWidth),height=Math.max(1,viewport.clientHeight);
      renderer.setSize(width,height,false);
      viewCamera.aspect=width/height;
      viewCamera.fov=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(37*deg/2)/Math.min(1,viewCamera.aspect/1.12)));
      viewCamera.updateProjectionMatrix();
      render();
    }
    resetView = () => {
      const anchor = vec(...GlassLab.pivot);
      if(['view','view-unit','bounce'].includes(step)) {
        orbit.target.copy(anchor).add(vec(-1.32,.1,1.35));
        const offset = step === 'view' ? vec(8.4,4.6,7.3) : vec(4.8,4.1,9.3);
        viewCamera.position.copy(anchor).add(offset);
      } else if (step==='refraction' || step==='mix') {
        orbit.target.copy(anchor).add(vec(.05,0,-.48));
        viewCamera.position.copy(anchor).add(vec(3.6,1.65,5.45));
      } else {
        orbit.target.copy(anchor).add(vec(-.24,-.24,-.14));
        viewCamera.position.copy(anchor).add(vec(-3.38,1.92,3.38));
      }
      orbit.update();
    };
    drawSpace = data => {
      renderer.domElement.setAttribute('aria-label',steps[step].title);
      point.set(...data.worldPos);
      clear();
      glass(data);
      if(step==='basis') normalFacet(data);
      if(step==='basis' || coordinateSteps.includes(step)) drawCoordinates(step, data);
      if(step==='refraction' || step==='mix') {
        background(data);
        dot(point,rgbColor(step==='mix'?data.finalCol:data.refrCol),.115);
        label('P',point,palette.mapped,-19,9);
      }
      if(step==='bounce') bounce(data,true);
      if(step==='mix') bounce(data,false);
      render();
    };
    orbit.addEventListener('change',render);
    new ResizeObserver(resize).observe(viewport);
  }
</script>
</body>
</html>
